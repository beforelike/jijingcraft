name: multi-search-engine
description: Multi search engine integration with 16 engines (7 CN + 9 Global). Supports advanced search operators, time filters, site search, privacy engines, and WolframAlpha.
version: 2.1.3
author: gpyangyoujun
license: MIT-0
trigger: |
  When to use:
  - User requests web search across multiple engines
  - Need to search in Chinese (use Domestic engines: Baidu, Bing CN, etc.)
  - Need to search in non-Chinese (use International engines: Google, DuckDuckGo, etc.)
  - Site-specific search with site: operator
  - File type search with filetype: operator
  - Time-filtered search (past hour/day/week/month/year)
  - Privacy-focused search (DuckDuckGo, Startpage, Brave, Qwant)
  - Knowledge computation (WolframAlpha)
  - DuckDuckGo bang shortcuts (!g, !gh, !so, !w, !yt)

  How to use:
  1. Detect query language: Chinese queries use Domestic engines, non-Chinese use International
  2. Initialize empty in-memory cookie store
  3. Execute search with web_fetch, adding 1-2 second delays between requests
  4. Batch requests in groups of 3-4 engines with sequential execution
  5. Include browser headers for legitimate user agent
  6. If access denied (403/429), fetch engine homepage to obtain fresh session cookies
  7. Store cookies only in memory, clear after session completes
  8. Retry once with fresh cookies after 2-second delay if needed
  9. Aggregate and summarize results from successful engines

  Available Engines:
  Domestic (7): Baidu, Bing CN, Bing INT, 360, Sogou, WeChat, Shenma
  International (9): Google, Google HK, DuckDuckGo, Yahoo, Startpage, Brave, Ecosia, Qwant, WolframAlpha
